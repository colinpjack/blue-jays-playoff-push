name: Update playoff dashboard

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "scripts/fetch_playoff_data.py"
      - ".github/workflows/update-dashboard.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest MLB data
        run: python scripts/fetch_playoff_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No standings or schedule changes this hour."
          else
            git commit -m "chore: refresh Blue Jays playoff dashboard"
            git push
          fi
